name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test core
        run: dotnet test tests/Neuraink.Core.Tests/Neuraink.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish app
        run: dotnet publish src/Neuraink.App/Neuraink.App.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o publish

      - name: Smoke test with screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          $cfg = Join-Path $env:APPDATA 'NEURAINK'
          New-Item -ItemType Directory -Force $cfg | Out-Null
          $db = Join-Path $env:RUNNER_TEMP 'NEURAINK Database'
          Copy-Item -Recurse -Force demo\database $db
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $PWD "shots\$name.png"))
          }
          function Run($lang, $theme, $page, $name) {
            $s = @{ Language = $lang; Theme = $theme; Accent = '#7C5CFF'; DatabasePath = $db; Style = 'ديواني'; ShowOriginal = $true; AppearanceOpen = $true }
            $s | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $cfg 'settings.json') -Encoding utf8
            $p = if ($page) { Start-Process publish\NEURAINK.exe -ArgumentList @('--page', $page) -PassThru } else { Start-Process publish\NEURAINK.exe -PassThru }
            Start-Sleep -Seconds 12
            Shot $name
            $alive = -not $p.HasExited
            if ($alive) { Stop-Process $p -Force; Start-Sleep -Seconds 2 }
            $log = Join-Path $cfg 'error.log'
            if (Test-Path $log) { Write-Host "---- error.log after $name ----"; Get-Content $log; Remove-Item $log }
            if (-not $alive) { Write-Host "::warning::app exited early in $name" }
          }
          Run 'Arabic'  'Dark'  $null            '01-dashboard-ar'
          Run 'Arabic'  'Dark'  'library'        '02-library-ar'
          Run 'Arabic'  'Dark'  'annotate-demo'  '03-annotate-ar'
          Run 'Arabic'  'Dark'  'annotate-brush' '03b-annotate-brush-ar'
          Run 'English' 'Dark'  'brush-options'  '03c-brush-options'
          Run 'Arabic'  'Dark'  'artboard'       '03d-artboard-ar'
          Run 'Arabic'  'Dark'  'annotate-save'  '04-annotate-saved-ar'
          Run 'Arabic'  'Dark'  'letters'        '05-letters-ar'
          Run 'Arabic'  'Dark'  'letters-detail' '05b-letter-detail-ar'
          Run 'Arabic'  'Dark'  $null            '06-dashboard-after-ar'
          Run 'Arabic'  'Dark'  'settings'       '07-settings-ar'
          Run 'English' 'Light' $null            '08-dashboard-en-light'
          Run 'English' 'Light' 'library'        '09-library-en-light'
          Run 'English' 'Dark'  'annotate-demo'  '10-annotate-en'
          Run 'English' 'Light' 'settings'       '11-settings-en-light'
          Run 'English' 'Dark'  'colorpicker'    '12-colorpicker'
          Get-ChildItem -Recurse $db | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300 | Write-Host

      - name: Upload screenshots
        continue-on-error: true
        if: always() && hashFiles('shots/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png

      - name: Publish screenshots to branch
        if: always() && github.event_name == 'push' && hashFiles('shots/*.png') != ''
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'shots-branch'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item shots\*.png $tmp -ErrorAction SilentlyContinue
          $url = git config --get remote.origin.url
          $auth = git config --get http.https://github.com/.extraheader
          Push-Location $tmp
          git init -q -b screenshots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -q -m "screenshots for $env:GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=$auth" push -f -q $url screenshots
          Pop-Location

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $ver = (Select-Xml -Path Directory.Build.props -XPath "//Version").Node.InnerText
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$PWD\publish" "/O$PWD\out" installer\NEURAINK.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        continue-on-error: true
        if: hashFiles('out/*.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: NEURAINK-Setup
          path: out/*.exe

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('out/*.exe') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.installer.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NEURAINK ${{ steps.installer.outputs.version }}
          body: Download **NEURAINK-Setup-${{ steps.installer.outputs.version }}.exe** below and run it.
          files: out/*.exe
          overwrite_files: true
          make_latest: true
